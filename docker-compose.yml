version: '3.8'
services:
  radar:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./findings.json:/data/findings.json
      - radar_data:/data
    environment:
      - JWT_SECRET=${JWT_SECRET:-}
      - PIPELINE_API_KEY=${PIPELINE_API_KEY:-disabled}
      - FINDINGS_FILE=/data/findings.json
volumes:
  radar_data: